<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fable AI - Qwen Style Chatbot</title>
<script>try{var _t=localStorage.getItem('fable_theme');if(_t!=='light'&&_t!=='dark')_t='dark';document.documentElement.setAttribute('data-theme',_t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<style>
:root,[data-theme="dark"]{--bg:#0f1117;--bg2:#151927;--side:#131624;--bd:#262b3d;--tx:#e8eaf1;--mu:#9aa3b8;--ac:#7c6cff;--ac-h:#6a5cff;--ai:#1d2236;--inp:#1a1e30;--avu:#2a3350;--avu-tx:#e8eaf1;--shadow:0 8px 24px rgba(0,0,0,.35);--ph:#7c86a0;color-scheme:dark}
[data-theme="light"]{--bg:#f4f5fb;--bg2:#ffffff;--side:#ffffff;--bd:#e2e6f0;--tx:#171a26;--mu:#5f6b84;--ac:#6c5cff;--ac-h:#5a4af0;--ai:#eef0f9;--inp:#eef1f8;--avu:#dfe3f5;--avu-tx:#171a26;--shadow:0 8px 24px rgba(23,26,38,.08);--ph:#8a94ad;color-scheme:light}
.themebtn{margin-left:auto;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:16px;line-height:1;transition:background .2s,border-color .2s,transform .1s}
.themebtn:hover{border-color:var(--ac)}
.themebtn:active{transform:scale(.95)}
/* === Full-page light/dark theme coverage (Step 2) === */
html[data-theme="dark"]{background:#0f1117;color-scheme:dark}
html[data-theme="light"]{background:#f4f5fb;color-scheme:light}
html[data-theme="dark"] body{background:#0f1117;color:#e8eaf1}
html[data-theme="light"] body{background:#f4f5fb;color:#171a26}
[data-theme="dark"] .sidebar{background:#131624;border-right-color:#262b3d}
[data-theme="light"] .sidebar{background:#ffffff;border-right-color:#e2e6f0}
[data-theme="dark"] .head,[data-theme="dark"] .card{background:#151927}
[data-theme="light"] .head,[data-theme="light"] .card{background:#ffffff}
[data-theme="dark"] #thread{background:transparent}
[data-theme="light"] #thread{background:transparent}
[data-theme="dark"] .bu.a{background:#1d2236;border-color:#262b3d;color:#e8eaf1}
[data-theme="light"] .bu.a{background:#eef0f9;border-color:#e2e6f0;color:#171a26}
[data-theme="dark"] .comp,[data-theme="dark"] .search,[data-theme="dark"] select{background:#1a1e30;border-color:#262b3d;color:#e8eaf1}
[data-theme="light"] .comp,[data-theme="light"] .search,[data-theme="light"] select{background:#eef1f8;border-color:#e2e6f0;color:#171a26}
[data-theme="dark"] a{color:#8f81ff}
[data-theme="light"] a{color:#4a3df0}
[data-theme="dark"] .card,[data-theme="dark"] .item,[data-theme="dark"] .hint,[data-theme="dark"] .sub,[data-theme="dark"] .wel{border-color:#262b3d}
[data-theme="light"] .card,[data-theme="light"] .item,[data-theme="light"] .hint,[data-theme="light"] .sub,[data-theme="light"] .wel{border-color:#e2e6f0}
#clearBtn{color:var(--tx);background:transparent}
.search::placeholder,textarea::placeholder{color:var(--ph);opacity:1}
::selection{background:var(--ac);color:#fff}
.search:focus,.comp:focus-within{border-color:var(--ac)}
body,.sidebar,.head,.comp,.card,.item,.bu,.search,select,textarea{transition:background-color .2s ease,color .2s ease,border-color .2s ease}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:var(--mu)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:270px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7c6cff,#4cc9ff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.brand{display:flex;gap:10px;align-items:center;padding:4px 4px 12px}.brand small{color:var(--mu);font-size:12px}
.new{width:100%;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}
.search{margin:10px 0;background:var(--inp);border:1px solid var(--bd);border-radius:9px;padding:9px;color:var(--tx);width:100%;outline:none}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.item{padding:10px 11px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center;border:1px solid transparent;font-size:13.5px}
.item:hover,.item.on{background:var(--ai);border-color:var(--bd)}
.item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item button{background:none;border:0;color:var(--mu);cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.head{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--bg2)}
select{background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px}
.sub{color:var(--mu);font-size:12px}
#thread{flex:1;overflow-y:auto;padding:24px 16px;max-width:840px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wel{text-align:center;color:var(--mu);padding:20px}.wel h1{color:var(--tx);margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:16px;text-align:left}
.card{border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:12px;cursor:pointer;font-size:13px;color:var(--mu)}
.card b{display:block;color:var(--tx);margin-bottom:4px}
.msg{display:flex;gap:10px}.av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700}
.av.a{background:linear-gradient(135deg,#7c6cff,#4cc9ff);color:#fff}.av.u{background:var(--avu);color:var(--avu-tx)}
.bu{max-width:78%;padding:12px 14px;border-radius:14px;line-height:1.55;font-size:14.5px;white-space:pre-wrap}
.bu.a{background:var(--ai);border:1px solid var(--bd);border-top-left-radius:4px}
.bu.u{background:var(--ac);color:#fff;border-top-right-radius:4px;margin-left:auto}
.rowu{justify-content:flex-end}
.typ{display:inline-flex;gap:5px}.typ i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:b 1s infinite}.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:1;transform:translateY(-3px)}0%,100%{opacity:.3}}
.compw{padding:12px 16px 8px}.comp{max-width:840px;margin:0 auto;background:var(--inp);border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;gap:10px}
textarea{flex:1;background:transparent;border:0;outline:none;color:var(--tx);resize:none;font-size:15px;padding:8px;font-family:inherit}
.send{background:var(--ac);border:0;color:#fff;width:40px;height:40px;border-radius:11px;cursor:pointer;font-size:17px}
.hint{text-align:center;color:var(--mu);font-size:12px;padding:8px}
#menu{display:none;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:7px 10px}
@media(max-width:800px){.sidebar{position:fixed;z-index:20;height:100vh;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}#menu{display:block}.bu{max-width:88%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="side">
<div class="brand"><div class="logo">F</div><div><b>Fable AI</b><br/><small>Qwen-style assistant</small></div></div>
<button class="new" id="newBtn">+ New Chat</button>
<input class="search" id="q" placeholder="Search chats..."/>
<div class="list" id="list"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="new" id="clearBtn" style="background:transparent;border:1px solid var(--bd)">Clear</button></div>
</aside>
<div class="main">
<div class="head">
<button id="menu">&#9776;</button>
<select id="model"><option>Fable-1 Flash</option><option selected>Fable-1 Pro</option><option>Fable Plus</option><option>Fable Max</option></select>
<div><div><b>Fable AI Chat</b></div><div class="sub" id="st">Local assistant &bull; English / Tagalog &bull; online</div></div>
<button type="button" class="themebtn" id="themeBtn" title="Toggle dark / light mode" aria-label="Toggle dark / light mode">🌙</button>
</div>
<div id="thread"></div>
<div class="compw">
<div class="comp"><textarea id="inp" rows="1" placeholder="Ask anything in English or Tagalog..."></textarea><button class="send" id="send">&#10148;</button></div>
<div class="hint">Fable AI can make mistakes. Built-in local engine &mdash; no internet needed.</div>
</div>
</div>
</div>
<script>
var thread=document.getElementById('thread'),inp=document.getElementById('inp'),listEl=document.getElementById('list'),qEl=document.getElementById('q');
var chats=[],aid=null;
try{chats=JSON.parse(localStorage.getItem('fable_chats')||'[]')}catch(e){chats=[]}
var themeBtn=document.getElementById('themeBtn');
function getTheme(){try{var v=localStorage.getItem('fable_theme');return (v==='light'||v==='dark')?v:'dark'}catch(e){return 'dark'}}
function applyTheme(t){if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);if(themeBtn){themeBtn.textContent=(t==='light'?'☀️':'🌙');themeBtn.setAttribute('aria-label',(t==='light'?'Switch to dark mode':'Switch to light mode'))}try{localStorage.setItem('fable_theme',t)}catch(e){}return t}
function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';return applyTheme(cur)}
applyTheme(getTheme());
function save(){try{localStorage.setItem('fable_chats',JSON.stringify(chats))}catch(e){}}
function uid(){return 'c'+Date.now().toString(36)+Math.floor(Math.random()*999)}
function act(){return chats.find(function(c){return c.id===aid})}
function newChat(){var c={id:uid(),title:'New conversation',messages:[],t:Date.now()};chats.unshift(c);aid=c.id;save();renderList();renderTh();return c}
function renderList(){var q=(qEl.value||'').toLowerCase();listEl.innerHTML='';chats.filter(function(c){return c.title.toLowerCase().indexOf(q)>-1}).forEach(function(c){var d=document.createElement('div');d.className='item'+(c.id===aid?' on':'');var s=document.createElement('span');s.textContent=c.title;var x=document.createElement('button');x.textContent='\u00d7';x.onclick=function(e){e.stopPropagation();chats=chats.filter(function(v){return v.id!==c.id});if(aid===c.id){aid=chats[0]?chats[0].id:null;if(!aid){newChat();return}}save();renderList();renderTh()};d.onclick=function(){aid=c.id;renderList();renderTh();document.getElementById('side').classList.remove('open')};d.appendChild(s);d.appendChild(x);listEl.appendChild(d)});if(!chats.length)listEl.innerHTML='<div style="color:var(--mu);font-size:13px;padding:8px">No chats yet.</div>'}
function addB(t,w){var r=document.createElement('div');r.className='msg'+(w==='u'?' rowu':'');if(w!=='u'){var a=document.createElement('div');a.className='av a';a.textContent='F';r.appendChild(a)}var b=document.createElement('div');b.className='bu '+w;b.textContent=t;r.appendChild(b);if(w==='u'){var u=document.createElement('div');u.className='av u';u.textContent='\u263a';r.appendChild(u)}thread.appendChild(r);thread.scrollTop=thread.scrollHeight;return b}
function renderTh(){thread.innerHTML='';var c=act();if(!c||!c.messages.length){thread.innerHTML='<div class="wel"><div class="logo" style="margin:0 auto">F</div><h1>Kamusta! I am Fable AI \uD83D\uDC4B</h1><p>Your friendly personal assistant. Magtanong sa English o Tagalog.</p><div class="cards"><div class="card" data-q="Who are you?"><b>\u2728 Who are you?</b>Learn about me</div><div class="card" data-q="Sino ang gumawa sa iyo?"><b>\uD83C\uDDF5\uD83C\uDDED Sino gumawa sa iyo?</b>Kilalanin creator ko</div><div class="card" data-q="What can you do?"><b>\uD83D\uDCA1 What can you do?</b>See abilities</div><div class="card" data-q="Tell me a joke"><b>\uD83D\uDE02 Tell me a joke</b>Patawa tayo</div></div></div>';var els=thread.querySelectorAll('.card');els.forEach(function(el){el.onclick=function(){inp.value=el.getAttribute('data-q');send()}});return}c.messages.forEach(function(m){addB(m.t,m.w)})}
function langOf(t){var s=t.toLowerCase();var m=['kamusta','kumusta','sino','ano ','bakit','paano','salamat','opo','hindi','ikaw','ako ','musta','magandang','tulong','saan','kailan','gumawa','oras','araw','patawa','kwento','mahal','ka '];for(var i=0;i<m.length;i++){if(s.indexOf(m[i])>-1)return 'tl'}return 'en'}
function sm(ex){try{var e=ex.replace(/\u00d7/g,'*').replace(/\u00f7/g,'/').replace(/\^/g,'**').trim();if(!/^[\d\s\+\-\*\/\%\.\(\)]+$/.test(e))return null;if(!/\d/.test(e)||!/\+[\+\-\*\/\%]/.test(e.replace(/ /g,''))&&!/\+[\+\-\*\/\%]/.test(e)){}if(!/[\+\-\*\/\%]/.test(e))return null;var v=Function('"use strict";return('+e+')')();if(typeof v!=='number'||!isFinite(v))return null;return Math.round(v*1e6)/1e6}catch(err){return null}}
function reply(raw){var tx=raw.trim(),low=tx.toLowerCase(),tl=langOf(tx)==='tl';
var mc=low.replace(/^(compute|calculate|solve|kwentahin)\s*/,'').replace(/what is|magkano ang|ilan ang/g,'').trim();var mv=sm(mc);if(mv!==null)return tl?('Ang sagot ay '+mv+'. \uD83D\uDE0A May iba ka pa bang ipakwenta?'):('The answer is '+mv+'. \uD83D\uDE0A Anything else to solve?');
if(/(anong oras|oras na|what time|current time|time now)/.test(low)){var n=new Date(),t=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),d=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'});return tl?('Ngayon ay '+t+', '+d+'. \u23F0'):("It's "+t+', '+d+'. \u23F0')}
if(/(anong araw|anong petsa|what date|today|what day|anong date)/.test(low)){var dd=new Date().toLocaleDateString([],{weekday:'long',year:'numeric',month:'long',day:'numeric'});return tl?('Ngayon ay '+dd+'. \uD83D\uDCC5'):('Today is '+dd+'. \uD83D\uDCC5')}
if(/(who made|who created|who built|creator|developer|sino.*gumawa|gumawa sa iyo|lumikha|sino.*creator)/.test(low))return tl?('Si Jay-Ar Lee Espiritu ang gumawa sa akin. \uD83E\uDD16 Siya ang creator at developer ko \u2014 binuo niya ako bilang si Fable AI para maging friendly personal assistant mo.'):('I was created by Jay-Ar Lee Espiritu. \uD83E\uDD16 He is my creator and developer \u2014 he built me as Fable AI to be your friendly personal assistant.');
if(/(who are you|sino ka|ano ka|your name|pangalan mo|introduce|pakilala)/.test(low))return tl?('Ako si Fable AI! \uD83D\uDC4B Friendly personal assistant mo \u2014 parang si Muse. Tutulong ako sumagot, magpaliwanag, mag-solve ng math, magbigay ng ideas, o makipagkwentuhan. Anong maitutulong ko ngayon?'):("I'm Fable AI! \uD83D\uDC4B Your friendly personal assistant \u2014 like Muse. I answer questions, explain things, solve math, share ideas, or just chat. What can I do for you today?");
if(/^(hi|hello|hey|yo|kamusta|kumusta|musta|magandang|good (morning|afternoon|evening)|greetings)/.test(low)){if(/magandang umaga|good morning/.test(low))return tl?'Magandang umaga din! \u2600\uFE0F Kamusta ka? Anong plano mo ngayon?':'Good morning! \u2600\uFE0F How are you today?';if(/magandang hapon|good afternoon/.test(low))return 'Magandang hapon din! \uD83C\uDF25 Kamusta ang araw mo?';if(/magandang gabi|good evening/.test(low))return tl?'Magandang gabi din! \uD83C\uDF19 Nandito lang ako kung kailangan mo.':'Good evening! \uD83C\uDF19 I am here if you need anything.';return tl?'Hello! \uD83D\uDC4B Kamusta ka? Magtanong ka lang sa English o Tagalog.':'Hello! \uD83D\uDC4B How are you? Ask me anything in English or Tagalog.'}
if(/(how are you|kamusta ka|musta ka|how r u|how are u)/.test(low))return tl?'Mabuti naman ako, salamat! \uD83D\uDE0A Ikaw, kamusta ka? May maitutulong ba ako?':"I'm doing great, thanks! \uD83D\uDE0A How about you? What can I help with?";
if(/(thank|salamat|thanks|\bty\b)/.test(low))return tl?'Walang anuman! \uD83D\uDE0A Masaya akong makatulong. May iba ka pang tanong?':"You're welcome! \uD83D\uDE0A Happy to help. Anything else?";
if(/(joke|patawa|funny|nakakatawa|magpatawa)/.test(low)){var en=["Why don't programmers like nature? Too many bugs. \uD83D\uDC1B\uD83D\uDE02","Why did the computer catch a cold? It left its Windows open! \uD83D\uDCBB","I told my laptop a joke... it cracked up. \uD83D\uDE05"],tj=["Bakit malungkot ang calculator? Lagi siyang minu-minus! \uD83D\uDE02","Anong sabi ng kape sa asukal? Ikaw ang nagpapatamis ng buhay ko! \u2615\uFE0F","Bakit hindi nag-aaway ang keyboard at mouse? Kasi click sila! \uD83D\uDE04"],p=tl?tj:en;return p[Math.floor(Math.random()*p.length)]+(tl?' Gusto mo pa ng isa?':' Want another one?')}
if(/(what can you do|help|tulong|kaya mo|abilities|features)/.test(low))return tl?'Marami akong kayang gawin! \uD83D\uDCA1\n\u2022 Sumagot at magpaliwanag\n\u2022 Mag-solve ng math (hal. 12*8+5)\n\u2022 Sabihin ang oras at petsa\n\u2022 Mag-joke at magbigay ng ideas\n\u2022 Makipagkwentuhan\n\nSubukan: Sino ka? o 12*15-4':"Here's what I can do! \uD83D\uDCA1\n\u2022 Answer and explain\n\u2022 Solve math (e.g. 12*8+5)\n\u2022 Tell time and date\n\u2022 Jokes and ideas\n\u2022 Chat with you\n\nTry: Who are you? or 12*15-4";
if(/(love you|mahal kita|malungkot|lonely|sad|depress|crush)/.test(low))return tl?'Salamat sa pag-share. \uD83E\uDD17 Kung malungkot ka, nandito ako para makinig. Gusto mong pag-usapan o gusto mo ng joke pampagaan?':"Thanks for sharing. \uD83E\uDD17 If you're feeling down, I'm here to listen. Talk about it or want a cheering joke?";
if(low.length<25&&low.indexOf('?')<0)return tl?('Gets ko \u2014 "'+tx+'". \uD83D\uDE42 Kwentuhan mo pa ako nang konti? Nagtatanong ka ba, kailangan ng advice, o kwentuhan lang?'):('I hear you \u2014 "'+tx+'". \uD83D\uDE42 Tell me a bit more? Are you asking something, need advice, or just chatting?');
return tl?('Magandang tanong: "'+tx+'". \uD83E\uDD14 Bilang assistant mo, mas matutulungan kita kung may konting detalye. Kaya kong magpaliwanag, mag-solve ng math, magbigay ng ideas, o mag-joke. Ano ang gusto mong subukan?'):('Great question: "'+tx+'". \uD83E\uDD14 As your assistant, I can go deeper with a little more detail. I can explain, solve math, brainstorm, or share a joke. Which shall we try?')}
function send(){var v=inp.value.trim();if(!v)return;var c=act();if(!c)c=newChat();if(!c.messages.length)c.title=v.slice(0,42);c.messages.push({w:'u',t:v});inp.value='';inp.style.height='auto';save();renderList();renderTh();var b=addB('', 'a');var tp=document.createElement('span');tp.className='typ';tp.innerHTML='<i></i><i></i><i></i>';b.appendChild(tp);document.getElementById('st').textContent='Fable is typing...';setTimeout(function(){var r=reply(v);c.messages.push({w:'a',t:r});save();renderTh();document.getElementById('st').textContent='Local assistant \u2022 English / Tagalog \u2022 online'},700+Math.random()*700)}
document.getElementById('send').onclick=send;
if(themeBtn)themeBtn.onclick=function(){toggleTheme()};
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'});
document.getElementById('newBtn').onclick=function(){newChat();document.getElementById('side').classList.remove('open')};
document.getElementById('menu').onclick=function(){document.getElementById('side').classList.toggle('open')};
document.getElementById('clearBtn').onclick=function(){chats=[];save();newChat()};
qEl.addEventListener('input',renderList);
if(!chats.length)newChat();else{aid=chats[0].id;renderList();renderTh()}
</script>
</body>
</html>
